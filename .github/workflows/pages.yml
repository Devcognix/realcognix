name: Publish web app
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git subtree split --prefix docs -b gh-pages-tmp
          git push -f origin gh-pages-tmp:gh-pages
